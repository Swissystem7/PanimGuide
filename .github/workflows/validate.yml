name: validate
# Runs the repository's checks on every push and pull request.
# PanimGuide is a static site: until a test suite lands (see the Grok Bot Draft PR that adds the first tests),
# the job syntax-checks every script and runs `node --test` only when a test directory exists.
# Added 2026-09-07 by the local dev factory so GitHub itself checks every Draft PR.
on:
  push:
    branches: ["master", "main"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install (only if a lockfile exists)
        run: |
          if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install --no-audit --no-fund; fi
      - name: Syntax-check scripts
        run: |
          set -e
          for f in $(git ls-files 'js/*.js' '*.mjs' 2>/dev/null); do node --check "$f"; done
      - name: Test
        run: |
          if [ -f package.json ] && node -e "process.exit(require('./package.json').scripts && require('./package.json').scripts.test ? 0 : 1)"; then
            npm test
          elif [ -d test ] || [ -d tests ]; then
            node --test
          else
            echo "no test suite yet - syntax check only"
          fi
